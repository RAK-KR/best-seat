<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빛나 사진관 · 1인칭 방탈출 시리즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gothic+A1:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hub/hub.css">
  <script src="shared/progress.js"></script>
</head>
<body>
  <div id="grain"></div>
  <main>
    <header>
      <div class="kicker">1인칭 3D 방탈출 시리즈 · 다섯 편</div>
      <h1>빛나 사진관</h1>
      <p class="lead">할아버지가 세상을 떠나고 한 달. 생일 아침, 사진관 2층으로 오라는 편지가 도착했다.</p>
    </header>
    <ol id="episodes"></ol>
    <footer>
      <p class="tip">순서대로 하는 것을 권합니다. 앞 편을 끝내면 다음 편이 열리고, 진행 기록은 이 브라우저에 저장됩니다.</p>
      <p class="tip">PC 전용 · 헤드폰 권장</p>
      <div class="tools">
        <button id="unlock">이미 해 본 편이 있어요 (모든 편 열기)</button>
        <button id="reset">기록 지우기</button>
      </div>
    </footer>
  </main>
  <script src="hub/hub.js"></script>
</body>
</html>
